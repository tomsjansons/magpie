[workspace]
resolver = "2"
members = ["crates/magpie-core", "crates/magpie"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/tomsjansons/magpie"

[workspace.dependencies]
magpie-core = { path = "crates/magpie-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
